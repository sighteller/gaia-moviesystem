<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Catalogo completo · Gaia</title><link rel="stylesheet" href="styles.css?v=20261004catalog"><style>body{overflow:auto}.catalog-shell{max-width:1200px;margin:auto;padding:32px 24px 140px}.catalog-tools{display:flex;gap:16px;flex-wrap:wrap;margin:24px 0}.catalog-card{display:grid;grid-template-columns:160px 1fr;gap:24px;background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:24px;margin-bottom:24px}.catalog-card h2{font-size:28px;margin:0 0 20px}.catalog-card label{display:block;margin:12px 0}.catalog-card input:not([type=checkbox]),.catalog-card select,.catalog-card textarea{display:block;width:100%;box-sizing:border-box;background:#101510;color:var(--text);border:1px solid #465139;border-radius:8px;padding:10px;font:inherit;margin-top:6px}.fields{display:flex;gap:16px;flex-wrap:wrap}.fields label{flex:1;min-width:130px}.catalog-cover>img{width:100%;height:auto;border-radius:12px}.catalog-card button,#save{padding:12px 18px;border-radius:10px;background:#20261c;color:var(--text);border:1px solid #465139;font:inherit;cursor:pointer}button:hover,button:focus-visible{background:var(--accent)!important;color:#17200c!important}.platform-row{display:grid;grid-template-columns:150px 1fr auto;gap:12px;align-items:center}.platform-row small{grid-column:2/4;color:var(--muted)}fieldset{border:1px solid #465139;border-radius:10px;margin:20px 0}.save-bar{position:fixed;bottom:0;left:0;right:0;background:#101510f5;border-top:1px solid #465139;padding:16px 24px;z-index:10;display:flex;align-items:center;justify-content:center;gap:20px}.save-bar p{margin:0}.candidates{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.candidates button{padding:3px}.candidates img{width:55px;height:80px;object-fit:contain}#status{white-space:pre-wrap}a{color:var(--accent)}@media(max-width:650px){.catalog-card{grid-template-columns:1fr}.catalog-cover{max-width:150px}.platform-row{grid-template-columns:1fr}.platform-row small{grid-column:auto}.save-bar{flex-wrap:wrap}}</style></head><body><main class="catalog-shell"><a href="./">← Torna a Gaia</a><h1>Catalogo completo</h1><p>Correggi i titoli, scegli le copertine e gestisci le piattaforme. Tutte le modifiche vengono confermate insieme con Salva modifiche. Archiviare conserva lo storico.</p><div class="catalog-tools"><label>Cerca titolo <input id="search" type="search"></label><label>Mostra <select id="filter"><option value="active">Titoli attivi</option><option value="all">Tutto il catalogo</option><option value="archived">Archivio</option><option value="dirty">Modificati</option><option value="no-quote">Senza citazione scelta</option></select></label><a href="citazioni.html">Gestisci proposte di citazione ↗</a></div><p id="count"></p><p id="status" role="status">Caricamento catalogo…</p><div id="list"></div></main><footer class="save-bar"><p id="dirty"></p><button id="save" type="button" disabled>Salva modifiche</button></footer><script type="module" src="catalog-editor.js?v=20261004catalog2"></script></body></html>
